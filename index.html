<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeMaster: Узнай свой уровень</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap');

        :root {
            --bg: #0b0f19;
            --card-bg: rgba(20, 25, 40, 0.6);
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --success: #10b981;
            --error: #ef4444;
            --option-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        [data-theme="light"] {
            --bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.8);
            --text: #0f172a;
            --text-muted: #64748b;
            --accent: #4f46e5;
            --accent-glow: rgba(79, 70, 229, 0.2);
            --option-bg: rgba(0, 0, 0, 0.02);
            --border: rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background 0.4s, color 0.4s;
            background-image: radial-gradient(circle at 50% 0%, var(--accent-glow) 0%, transparent 50%);
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--option-bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            z-index: 10;
        }
        .theme-toggle:hover { transform: scale(1.1) rotate(15deg); }

        h1 {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        p { font-size: 16px; color: var(--text-muted); margin-bottom: 30px; line-height: 1.6; }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: 0.3s;
            box-shadow: 0 10px 20px -10px var(--accent);
        }

        .btn:hover { transform: translateY(-3px); box-shadow: 0 15px 25px -10px var(--accent); }
        .btn-secondary { background: var(--option-bg); color: var(--text); border: 1px solid var(--border); box-shadow: none; }
        .btn-secondary:hover { background: var(--border); transform: translateY(-2px); }

        .hidden { display: none !important; }

        .difficulty-select { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        .diff-btn {
            padding: 10px 20px; border-radius: 10px; border: 1px solid var(--border);
            background: var(--option-bg); color: var(--text); cursor: pointer; font-weight: 600; transition: 0.2s;
        }
        .diff-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        .stats-bar {
            display: flex; justify-content: space-between; margin-bottom: 20px;
            font-weight: 600; font-size: 14px; color: var(--text-muted);
            padding: 0 5px;
        }
        .timer { color: #f59e0b; font-weight: 800; font-size: 18px; }

        .progress-bar { width: 100%; height: 8px; background: var(--border); border-radius: 10px; margin-bottom: 30px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #6366f1, #c084fc); width: 0%; transition: 0.3s; }

        .question { font-size: 20px; font-weight: 700; margin-bottom: 25px; text-align: left; line-height: 1.4; }

        .option {
            background: var(--option-bg);
            border: 2px solid var(--border);
            padding: 18px;
            border-radius: 14px;
            margin-bottom: 12px;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .option:hover { background: var(--border); transform: translateX(5px); }
        .option.correct { background: rgba(16, 185, 129, 0.2) !important; border-color: var(--success); color: var(--success); }
        .option.wrong { background: rgba(239, 68, 68, 0.2) !important; border-color: var(--error); color: var(--error); }

        .result-title { font-size: 40px; font-weight: 900; color: var(--accent); margin: 20px 0; text-shadow: 0 0 30px var(--accent-glow); }
        .result-desc { color: var(--text-muted); margin-bottom: 30px; font-size: 16px; }

        .leaderboard { text-align: left; margin-top: 30px; background: var(--option-bg); border-radius: 16px; padding: 20px; border: 1px solid var(--border); }
        .leaderboard-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .leaderboard-item:last-child { border-bottom: none; }
        .leaderboard-item span:first-child { font-weight: 700; }
        .leaderboard-item span:last-child { color: var(--accent); font-weight: 800; }

        input[type="text"] {
            width: 100%; padding: 16px; margin-bottom: 15px; border-radius: 12px;
            border: 2px solid var(--border); background: var(--option-bg); color: var(--text);
            font-family: inherit; font-size: 16px; outline: none; transition: 0.2s;
        }
        input[type="text"]:focus { border-color: var(--accent); }

        .review-list { text-align: left; max-height: 200px; overflow-y: auto; margin-top: 20px; font-size: 14px; }
        .review-item { padding: 10px; border-bottom: 1px solid var(--border); }
        .review-item strong { color: var(--error); }
        .review-item span { color: var(--success); }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .shake { animation: shake 0.3s; }
    </style>
</head>
<body>

<div class="container" id="start-screen">
    <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙</button>
    <h1>🚀 CodeMaster</h1>
    <p>Проверь свои знания. 100 вопросов в базе. Сможешь пройти без ошибок?</p>
    
    <div class="difficulty-select">
        <button class="diff-btn active" onclick="setDifficulty('easy', this)">Лёгкий</button>
        <button class="diff-btn" onclick="setDifficulty('medium', this)">Средний</button>
        <button class="diff-btn" onclick="setDifficulty('hard', this)">Сложный</button>
    </div>

    <button class="btn" onclick="startTest()">Начать тест</button>
</div>

<div class="container hidden" id="quiz-screen">
    <div class="stats-bar">
        <span id="question-counter">Вопрос 1/15</span>
        <span class="timer" id="timer-display">10:00</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="question" id="question-text"></div>
    <div id="options-container"></div>
</div>

<div class="container hidden" id="result-screen">
    <h1>Результат</h1>
    <div class="result-title" id="result-title"></div>
    <div class="result-desc" id="result-desc"></div>
    
    <div id="review-block" class="review-list hidden">
        <h3>Разбор ошибок:</h3>
        <div id="review-container"></div>
    </div>

    <div id="name-input-block">
        <p>Введи имя для таблицы лидеров:</p>
        <input type="text" id="player-name" placeholder="Твоё имя" maxlength="15">
        <button class="btn" onclick="submitScore()">Сохранить результат</button>
    </div>

    <div class="leaderboard" id="leaderboard-container">
        <h3 style="margin-bottom: 15px;">🏆 Топ-10</h3>
        <div id="leaderboard-list">Загрузка...</div>
    </div>

    <button class="btn btn-secondary" onclick="location.reload()">Пройти заново</button>
</div>

    // ==== ЗВУКИ (Web Audio API) ====
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();
    
    function playSound(type) {
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        if (type === 'correct') {
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
            oscillator.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        } else {
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        }
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.3);
    }

        { lvl: 'hard', q: "Что такое паттерн Singleton?", options: ["Один экземпляр", "Много", "Ноль", "Два"], correct: 0 },
        { lvl: 'hard', q: "Что такое паттерн Factory?", options: ["Создание объектов", "Удаление", "Копия", "Тест"], correct: 0 },
        { lvl: 'hard', q: "Что такое паттерн Observer?", options: ["Подписка на события", "Создание", "Удаление", "Копия"], correct: 0 },
        { lvl: 'hard', q: "Что такое микросервисы?", options: ["Мелкие сервисы", "Монолит", "Язык", "База"], correct: 0 },
        { lvl: 'hard', q: "Что такое монолит?", options: ["Единое приложение", "Микросервисы", "Язык", "База"], correct: 0 },
        { lvl: 'hard', q: "Что такое GraphQL?", options: ["Язык запросов", "REST", "База", "Сервер"], correct: 0 },
        { lvl: 'hard', q: "Что такое gRPC?", options: ["RPC-фреймворк", "REST", "База", "Сервер"], correct: 0 },
        { lvl: 'hard', q: "Что такое Kafka?", options: ["Очередь сообщений", "База", "Язык", "Сервер"], correct: 0 },
        { lvl: 'hard', q: "Что такое RabbitMQ?", options: ["Брокер сообщений", "База", "Язык", "Сервер"], correct: 0 },
        { lvl: 'hard', q: "Что такое Redis?", options: ["In-memory БД", "SQL БД", "Язык", "Сервер"], correct: 0 },
        { lvl: 'hard', q: "Что такое NoSQL?", options: ["Нереляционная БД", "Реляционная", "Язык", "Сервер"], correct: 0 },
        { lvl: 'hard', q: "Что такое MongoDB?", options: ["Документная БД", "SQL", "Язык", "Сервер"], correct: 0 },
        { lvl: 'hard', q: "Что такое индексы БД?", options: ["Ускорение поиска", "Замедление", "Удаление", "Сжатие"], correct: 0 },
        { lvl: 'hard', q: "Что такое транзакция?", options: ["Группа операций", "Одна операция", "Удаление", "Сжатие"], correct: 0 },
        { lvl: 'hard', q: "Что такое нормализация БД?", options: ["Устранение избыточности", "Добавление", "Удаление", "Сжатие"], correct: 0 },
        { lvl: 'hard', q: "Что такое денормализация?", options: ["Ускорение чтения", "Замедление", "Удаление", "Сжатие"], correct: 0 },
        { lvl: 'hard', q: "Что такое CAP-теорема?", options: ["3 ограничения", "2 ограничения", "1 ограничение", "0"], correct: 0 },
        { lvl: 'hard', q: "Что такое MapReduce?", options: ["Параллельная обработка", "База", "Язык", "Сервер"], correct: 0 }
    ];

    let selectedQuestions = [];
    let currentQuestion = 0;
    let score = 0;
    let timerInterval;
    let timeLeft = 600;
    let endTime;
    let currentDifficulty = 'easy';
    let wrongAnswers = [];

    window.toggleTheme = () => {
        const body = document.body;
        const btn = document.getElementById('theme-btn');
        if (body.getAttribute('data-theme') === 'light') {
            body.removeAttribute('data-theme');
            btn.innerText = '🌙';
        } else {
            body.setAttribute('data-theme', 'light');
            btn.innerText = '☀️';
        }
    };

    window.setDifficulty = (lvl, btn) => {
        currentDifficulty = lvl;
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    };

    window.startTest = () => {
        // Фильтруем по сложности и выбираем 15
        let pool = allQuestions.filter(q => q.lvl === currentDifficulty);
        if (pool.length < 15) pool = allQuestions; // Fallback
        
        selectedQuestions = [...pool].sort(() => 0.5 - Math.random()).slice(0, 15);
        
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        
        endTime = Date.now() + timeLeft * 1000;
        updateTimer();
        timerInterval = setInterval(updateTimer, 1000);
        
        showQuestion();
    };

    function updateTimer() {
        const remaining = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
        const minutes = Math.floor(remaining / 60);
        const seconds = remaining % 60;
        document.getElementById('timer-display').innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        
        if (remaining <= 0) {
            clearInterval(timerInterval);
            showResult();
        }
    }

    function showQuestion() {
        if (currentQuestion >= selectedQuestions.length) {
            showResult();
            return;
        }

        const q = selectedQuestions[currentQuestion];
        document.getElementById('question-text').innerText = q.q;
        document.getElementById('question-counter').innerText = `Вопрос ${currentQuestion + 1}/${selectedQuestions.length}`;
        
        const progressPercent = (currentQuestion / selectedQuestions.length) * 100;
        document.getElementById('progress-fill').style.width = progressPercent + '%';

        const container = document.getElementById('options-container');
        container.innerHTML = '';

        q.options.forEach((opt, index) => {
            const div = document.createElement('div');
            div.className = 'option';
            div.innerText = opt;
            div.onclick = () => checkAnswer(index, div);
            container.appendChild(div);
        });
    }

    function checkAnswer(index, element) {
        const q = selectedQuestions[currentQuestion];
        const correctIndex = q.correct;
        
        if (index === correctIndex) {
            element.classList.add('correct');
            playSound('correct');
            score++;
        } else {
            element.classList.add('wrong');
            element.classList.add('shake');
            playSound('wrong');
            // Показать правильный
            const options = document.querySelectorAll('.option');
            options[correctIndex].classList.add('correct');
            wrongAnswers.push({ question: q.q, correct: q.options[correctIndex] });
        }

        document.querySelectorAll('.option').forEach(el => el.style.pointerEvents = 'none');
        setTimeout(() => {
            currentQuestion++;
            showQuestion();
        }, 1000);
    }

    function showResult() {
        clearInterval(timerInterval);
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        const title = document.getElementById('result-title');
        const desc = document.getElementById('result-desc');

        if (score >= 13) { title.innerText = "🏆 Сеньор"; desc.innerText = "Ты знаешь всё!"; }
        else if (score >= 9) { title.innerText = "🚀 Мидл"; desc.innerText = "Отличный результат!"; }
        else if (score >= 5) { title.innerText = "🌱 Джуниор"; desc.innerText = "Хорошее начало!"; }
        else { title.innerText = "👶 Новичок"; desc.innerText = "Главное — практика."; }

        // Разбор ошибок
        if (wrongAnswers.length > 0) {
            document.getElementById('review-block').classList.remove('hidden');
            const container = document.getElementById('review-container');
            container.innerHTML = '';
            wrongAnswers.forEach(w => {
                container.innerHTML += `<div class="review-item"><strong>${w.question}</strong><br>Правильный ответ: <span>${w.correct}</span></div>`;
            });
        }

        loadLeaderboard();
    }

    window.submitScore = async () => {
        const name = document.getElementById('player-name').value.trim();
        if (!name) return alert("Введи имя!");
        
        // Локальное сохранение (если Firebase не настроен)
        let localData = JSON.parse(localStorage.getItem('leaderboard') || '[]');
        localData.push({ name, score, timestamp: Date.now() });
        localStorage.setItem('leaderboard', JSON.stringify(localData));
        
        document.getElementById('name-input-block').classList.add('hidden');
        loadLeaderboard();
    };

    function loadLeaderboard() {
        const list = document.getElementById('leaderboard-list');
        let localData = JSON.parse(localStorage.getItem('leaderboard') || '[]');
        
        if (localData.length === 0) {
            list.innerHTML = 'Пока никто не играл.';
            return;
        }
        
        localData.sort((a, b) => b.score - a.score);
        list.innerHTML = '';
        localData.slice(0, 10).forEach((item, i) => {
            list.innerHTML += `<div class="leaderboard-item"><span>${i+1}. ${item.name}</span><span>${item.score}/15</span></div>`;
        });
    }
</script>
